services:
  postgres:
    image: postgres:16-alpine
    container_name: dg-postgres
    environment:
      POSTGRES_USER: digital_gold
      POSTGRES_PASSWORD: digital_gold
      POSTGRES_DB: digital_gold
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - dg_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_gold -d digital_gold"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dg-redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - dg_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: dg-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_HOST_PORT:-9200}:9200"
      - "${OPENSEARCH_METRICS_HOST_PORT:-9600}:9600"
    volumes:
      - dg_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dg-api
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/typescript ]; then npm ci; fi && npm run db:migrate && npm run dev:api"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://digital_gold:digital_gold@postgres:5432/digital_gold
      REPOSITORY_MODE: postgres
      QUEUE_MODE: bullmq
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - dg_api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dg-worker
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/typescript ]; then npm ci; fi && npm run dev:worker"
    environment:
      API_BASE_URL: http://api:4000
      QUEUE_MODE: bullmq
      REDIS_URL: redis://redis:6379
      SEARCH_MODE: opensearch
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: products
      EMBEDDING_MODE: mock
    volumes:
      - .:/app
      - dg_worker_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: dg-web
    working_dir: /app
    command: sh -c "if [ ! -d node_modules/next ]; then npm ci; fi && npm run dev:web"
    environment:
      API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dg_web_node_modules:/app/node_modules
      - dg_web_next:/app/apps/web/.next
    depends_on:
      api:
        condition: service_started

volumes:
  dg_postgres_data:
  dg_redis_data:
  dg_opensearch_data:
  dg_api_node_modules:
  dg_worker_node_modules:
  dg_web_node_modules:
  dg_web_next:
